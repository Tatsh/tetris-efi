jobs:
  analyze:
    name: 'Analyze'
    permissions:
      actions: 'read'
      contents: 'read'
      security-events: 'write'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          persist-credentials: false
      - name: 'Initialize CodeQL'
        uses: 'github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3'
        with:
          languages: '${{ matrix.language }}'
      - name: Install tools
        run: sudo apt-get update -y && sudo apt-get install -y gnu-efi mtools ninja-build xorriso
      - run: |
          cmake -G Ninja .
          cmake --build . --config Debug
      - name: 'Perform CodeQL Analysis'
        uses: 'github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3'
        with:
          category: '/language:${{matrix.language}}'
    strategy:
      fail-fast: false
      matrix:
        language:
          - 'c-cpp'
name: 'CodeQL'
'on':
  pull_request:
    branches:
      - 'master'
  push:
    branches:
      - 'master'
  schedule:
    - cron: '15 4 * * 3'
